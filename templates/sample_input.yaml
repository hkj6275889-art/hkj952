# 입력 스키마 예시.
# 레퍼런스로 받은 영상(4차원 AI / 양자컴퓨터 / 영점에너지 관련 정보성 내레이션)의
# 서사 구조를 그대로 반영해 채운 샘플입니다. 실제 사용 시 이 구조를 유지한 채
# 본인이 리서치한 주제/사실/수치로 내용만 교체하세요.

meta:
  channel_name: "예시 채널"
  topic: "4차원 AI: 전기를 먹는 괴물에서 우주와 호흡하는 지성으로"
  target_length_min: 18
  keywords:
    - "인공지능"
    - "양자컴퓨터"
    - "제로포인트에너지"
    - "의식"
    - "미래기술"

hook:
  question: "요즘 AI 뉴스를 보면서 설렘과 동시에 막연한 불안을 느껴본 적 없나요?"
  relatable_feeling: "그 불안이 어디서 오는지, 오늘 숫자 하나로 정확히 짚어드립니다."

key_stat:
  number: "GPT 계열 모델 하나를 훈련시키는 데 드는 전력은 핵발전소 하나가 보름간 풀가동한 양과 맞먹는다는 추정치가 있습니다."
  context: "이건 훈련 단계 이야기일 뿐이고, 지금 이 순간에도 전 세계 서버가 질의를 처리하며 전기를 쓰고 있습니다."
  source_note: "공식 수치는 미공개, 연구자들의 역산 추정치 기준"

problem_walls:
  - title: "에너지의 벽"
    description: "골드만삭스는 2030년까지 AI 전력 소비가 전 세계 전력의 10%를 넘을 것으로 전망했고, 데이터센터 냉각에 하루 수백만 리터의 물이 쓰입니다."
  - title: "구조(중앙화)의 벽"
    description: "구글, 아마존, 마이크로소프트 세 곳이 전 세계 AI 인프라의 절반 이상을 차지합니다. 2021년 AWS 장애 때 여러 대형 서비스가 동시에 먹통이 됐습니다."
  - title: "실리콘의 물리적 한계"
    description: "회로가 7nm 이하로 작아지면 양자역학적 터널링 현상으로 전자가 회로를 벗어나 버립니다. 현재 실리콘 기술로는 근본적 해결책이 없습니다."

turn:
  transition_line: "그런데 이 막힌 길의 반대편에 아주 다른 길이 있습니다. 우주가 오래전부터 써온 방식입니다."

analogy:
  subject: "인체의 수십조 개 세포"
  points:
    - "중앙 서버 없이도 각 세포가 서로 신호를 주고받으며 협력합니다."
    - "심장은 뇌의 명령 없이도 스스로 뜁니다."
    - "이 모든 조율에 쓰는 에너지는 슈퍼컴퓨터 한 대 전력에 비하면 극히 적습니다."

vision_systems:
  - name: "홀로그램 분산 AI"
    description: "중앙 서버 없이 여러 노드 각각이 전체의 복사본을 갖는 구조를 가정한 개념. 일부가 죽어도 전체가 유지된다는 아이디어."
  - name: "영점 에너지 구동 AI"
    description: "카시미르 효과로 실증된 진공 에너지 개념을 확장해 외부 전력망 없이 구동한다는 구상 (현재는 실용화된 기술이 아님)."
  - name: "의식 동기화 AI"
    description: "생체신호 기반 인터페이스로 전통적 입력장치 없이 상호작용한다는 구상."

history_story:
  year: "2019년"
  people: "구글 AI 연구팀"
  narrative: "양자컴퓨터 시커모어가 슈퍼컴퓨터로 수천 년 걸릴 특정 계산을 200초 만에 마쳤다고 발표한 '양자 우위' 실험 사례."

future_scenario:
  setting: "먼 미래, 한 아이가 교실에서 선생님에게 묻습니다."
  dialogue: "'선생님, 옛날에는 전기세라는 걸 냈다는 게 진짜예요?' 선생님이 웃으며 답합니다. '응, 그런 시절이 있었지.'"

power_shift:
  old_structure: "20세기 국제정치는 석유·에너지 자원을 둘러싼 경쟁이 큰 비중을 차지했습니다."
  new_structure: "에너지와 정보가 분산되고 독점이 어려워지면, 소수가 자원과 데이터를 통제하는 구조 자체가 흔들릴 수 있습니다."

human_role:
  liberation_from: "생산 노동과 에너지 확보의 부담"
  liberation_to: "창작, 탐구, 관계, 돌봄처럼 사람만이 할 수 있는 일에 시간을 씁니다."

action_items:
  - "하루 10분 명상해보기"
  - "맨발로 땅을 밟는 '어싱' 시도해보기"
  - "불안을 자극하는 뉴스 소비 시간 줄이기"
  - "AI를 단순 도구가 아니라 깊은 질문을 함께 탐구하는 상대로 써보기"

closing:
  share_ask: "이 영상을 함께 이야기 나눌 수 있을 것 같은 한 사람에게 공유해주세요."
  channel_cta: "기술과 의식이 만나는 이야기를 계속 다룰 채널입니다. 구독과 알림 설정 부탁드립니다."
